<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officeneed Email Signature</title>
  <!-- Outlook specific styles -->
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">

  <!-- Main Signature Table -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 1060px; font-family: Arial, Helvetica, sans-serif; background-color: #ffffff; border: 1px solid #e5e5e5;">
    <tr>
      <!-- LEFT DECORATIVE STRIP: Geometric Pattern -->
      <td width="70" background="https://pratik-bhatia.github.io/email-signature/assets/seamless-geometric-pattern.png" style="background-color: #ffffff; background-image: url('https://pratik-bhatia.github.io/email-signature/assets/seamless-geometric-pattern.png'); background-repeat: repeat; border-right: 1px solid #e5e5e5;">
        <!-- Transparent spacer to ensure height/width -->
        <img src="https://pratik-bhatia.github.io/email-signature/assets/seamless-geometric-pattern.png" width="70" height="1" style="display: block; opacity: 0; visibility: hidden;" alt="" />
      </td>

      <!-- MAIN CONTENT: Plain White Background -->
      <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 25px 0px 25px 30px;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            
            <!-- LEFT: Logo (Plain White) -->
            <td valign="middle" width="220" style="padding-right: 30px; text-align: left;">
              <a href="https://www.officeneed.in/" target="_blank" style="text-decoration: none;">
                <img src="https://pratik-bhatia.github.io/email-signature/assets/officeneed-logo.png" alt="Officeneed" width="200" height="auto" style="display: block; border: 0; outline: none; text-decoration: none;" />
              </a>
            </td>

            <!-- Divider -->
            <td valign="middle" width="2" style="background-color: #dcdcdc;"></td>
            <td valign="middle" width="30"></td> <!-- Spacing -->

            <!-- MIDDLE-LEFT: Name & Address (Plain White) -->
            <td valign="middle" width="240" style="padding-right: 15px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #2f2f2f; line-height: 24px; padding-bottom: 2px;">
                    Team Officeneed
                  </td>
                </tr>
                <tr>
                  <td style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #666666; padding-bottom: 2px; line-height: 20px;">
                    Operations
                  </td>
                </tr>
                <tr>
                  <td style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; color: #2f2f2f; padding-bottom: 2px;">
                    Officeneed Solutions Pvt Ltd
                  </td>
                </tr>
                <tr>
                  <td style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #666666; line-height: 15px;">
                    Adarsh Apartments, DBC, Model Colony,<br/>
                    Shivajinagar, Pune 411 016
                  </td>
                </tr>
              </table>
            </td>

            <!-- MIDDLE-RIGHT: Contact Info (Plain White) -->
            <td valign="middle" width="220" style="padding-right: 15px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding-bottom: 4px;">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/phone.png" alt="Phone" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="tel:+917972797965" style="color: #2f2f2f; text-decoration: none;">+91 797279 7965</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom: 4px;">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/email.png" alt="Email" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="mailto:contact@officeneed.in" style="color: #2f2f2f; text-decoration: none;">contact@officeneed.in</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td>
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/website.png" alt="Website" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="https://www.officeneed.in/" target="_blank" style="color: #2f2f2f; text-decoration: none;">www.officeneed.in</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>

            <!-- Divider -->
            <td valign="middle" width="2" style="background-color: #dcdcdc;"></td>
            <td valign="middle" width="30"></td> <!-- Spacing -->

            <!-- RIGHT: Branding & Social Icons (Flipped Triangular Pattern) -->
            <td valign="middle" style="text-align: left; background-color: #ffffff; padding-right: 30px; padding-left: 10px;" background="https://pratik-bhatia.github.io/email-signature/assets/triangular-pattern-flipped.png">
              <div style="background-image: url('https://pratik-bhatia.github.io/email-signature/assets/triangular-pattern-flipped.png'); background-repeat: repeat; height: 100%;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td style="padding-bottom: 2px; text-align: left;">
                      <a href="https://www.officeneed.in/" target="_blank" style="text-decoration: none;">
                        <img src="https://pratik-bhatia.github.io/email-signature/assets/officeneed-wordmark.png" alt="OFFICENEED" width="160" height="auto" style="display: block; border: 0; outline: none; text-decoration: none;" />
                      </a>
                    </td>
                  </tr>
                  
                  <tr>
                    <td align="left">
                      <table border="0" cellpadding="0" cellspacing="0">
                        <tr>
                          <td style="padding-right: 12px;">
                            <a href="https://www.linkedin.com/company/officeneed-in/" target="_blank" style="text-decoration: none; display: inline-block;">
                              <img src="https://pratik-bhatia.github.io/email-signature/assets/linkedin.png" alt="LinkedIn" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                            </a>
                          </td>
                          <td style="padding-right: 12px;">
                            <a href="https://www.instagram.com/officeneed.in?igsh=Zm1taW1mOXJlY25x" target="_blank" style="text-decoration: none; display: inline-block;">
                              <img src="https://pratik-bhatia.github.io/email-signature/assets/instagram.png" alt="Instagram" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                            </a>
                          </td>
                          <td style="padding-right: 12px;">
                            <a href="https://www.facebook.com/share/19QDcgdY8n/" target="_blank" style="text-decoration: none; display: inline-block;">
                              <img src="https://pratik-bhatia.github.io/email-signature/assets/facebook.png" alt="Facebook" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                            </a>
                          </td>
                          
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </div>
            </td>

          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
