<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officeneed Email Signature</title>
  
    <meta name="color-scheme" content="light only">
    <meta name="supported-color-schemes" content="light">
    <style type="text/css">
      :root {
        color-scheme: light only;
        supported-color-schemes: light;
      }
    </style>
    <!-- Outlook specific styles -->
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a { font-family: 'Nexa', Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
</head>
<body bgcolor="#ffffff" style="margin: 0; padding: 0; background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff);">

  <!-- Main Signature Table -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#ffffff" style="max-width: 1060px; font-family: 'Nexa', Arial, Helvetica, sans-serif; background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); border: 1px solid #e5e5e5;">
    <tr>
      <!-- LEFT DECORATIVE STRIP: Geometric Pattern -->
        <td width="90" valign="top" bgcolor="#ffffff" style="width: 90px; background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); border-right: 1px solid #e5e5e5; padding: 0; margin: 0;">
          <img src="https://pratik-bhatia.github.io/email-signature/assets/seamless-geometric-pattern-v9.png" width="90" height="170" alt="" style="display: block; width: 90px; height: 170px; border: 0;" />
        </td>

      <!-- MAIN CONTENT: Plain White Background -->
      <td bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); padding: 25px 0px 25px 30px;">
        <table border="0" cellpadding="0" cellspacing="0" width="100%">
          <tr>
            
            <!-- LEFT: Logo (Plain White) -->
            <td valign="middle" width="250" bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); padding-right: 30px; text-align: left;">
              <a href="https://www.officeneed.in/" target="_blank" style="text-decoration: none;">
                <img src="https://pratik-bhatia.github.io/email-signature/assets/officeneed-logo-full.png" alt="Officeneed" width="250" height="auto" style="display: block; border: 0; outline: none; text-decoration: none;" />
              </a>
            </td>

            <!-- Divider -->
            <td valign="middle" width="2" style="background-color: #dcdcdc;"></td>
            <td valign="middle" width="30" bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff);"></td> <!-- Spacing -->

            <!-- MIDDLE-LEFT: Name & Address (Plain White) -->
              <td valign="middle" width="280" bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); padding-right: 15px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%">
                  <tr>
                    <td style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #2f2f2f; line-height: 22px; margin: 0; padding: 0; padding-bottom: 4px; mso-line-height-rule: exactly;">
                      Team Officeneed
                    </td>
                  </tr>
                  <tr>
                    <td style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 15px; color: #666666; line-height: 18px; margin: 0; padding: 0; padding-bottom: 6px; mso-line-height-rule: exactly;">
                      Operations
                    </td>
                  </tr>
                  <tr>
                    <td style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; color: #2f2f2f; line-height: 16px; margin: 0; padding: 0; padding-bottom: 4px; mso-line-height-rule: exactly; white-space: nowrap;">
                      Officeneed Solutions Pvt Ltd
                    </td>
                  </tr>
                  <tr>
                    <td style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 13px; color: #666666; line-height: 16px; margin: 0; padding: 0; mso-line-height-rule: exactly;">
                      Adarsh Apartments, DBC, Model Colony, Shivajinagar, Pune 411 016
                    </td>
                  </tr>
                </table>
              </td>

            <!-- MIDDLE-RIGHT: Contact Info (Plain White) -->
            <td valign="middle" width="220" bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff); padding-right: 15px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding-bottom: 4px;">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/phone-color.png" alt="Phone" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="tel:+917972797965" style="color: #2f2f2f; text-decoration: none;">+91 797279 7965</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td style="padding-bottom: 4px;">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/email-color.png" alt="Email" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="mailto:contact@officeneed.in" style="color: #2f2f2f; text-decoration: none;">contact@officeneed.in</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td>
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td valign="middle" style="padding-right: 12px;">
                          <img src="https://pratik-bhatia.github.io/email-signature/assets/website-color.png" alt="Website" width="24" height="24" style="display: block; border: 0; outline: none; text-decoration: none;" />
                        </td>
                        <td valign="middle" style="font-family: 'Nexa', Arial, Helvetica, sans-serif; font-size: 14px;">
                          <a href="https://www.officeneed.in/" target="_blank" style="color: #2f2f2f; text-decoration: none;">www.officeneed.in</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>

            <!-- Divider -->
            <td valign="middle" width="2" style="background-color: #dcdcdc;"></td>
            <td valign="middle" width="30" bgcolor="#ffffff" style="background-color: #ffffff; background-image: linear-gradient(#ffffff, #ffffff);"></td> <!-- Spacing -->

            <!-- RIGHT: Social Icons (Plain White) -->
            <td valign="middle" bgcolor="#ffffff" style="text-align: left; background-color: #ffffff; padding-right: 30px; padding-left: 25px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="left">
                    <table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="padding-right: 12px;">
                          <a href="https://www.linkedin.com/company/officeneed-in/" target="_blank" style="text-decoration: none; display: inline-block;">
                                <img src="https://pratik-bhatia.github.io/email-signature/assets/linkedin.png" alt="LinkedIn" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                              </a>
                            </td>
                            <td style="padding-right: 12px;">
                              <a href="https://www.instagram.com/officeneed.in?igsh=Zm1taW1mOXJlY25x" target="_blank" style="text-decoration: none; display: inline-block;">
                                <img src="https://pratik-bhatia.github.io/email-signature/assets/instagram.png" alt="Instagram" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                              </a>
                            </td>
                            <td style="padding-right: 12px;">
                              <a href="https://www.facebook.com/share/19QDcgdY8n/" target="_blank" style="text-decoration: none; display: inline-block;">
                                <img src="https://pratik-bhatia.github.io/email-signature/assets/facebook.png" alt="Facebook" width="32" height="32" style="display: block; border: 0; outline: none; text-decoration: none;" />
                              </a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
            </td>

          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>
</html>
